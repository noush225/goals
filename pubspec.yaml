name: momentum
description: "Momentum — productivité minimaliste pour créatifs."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.20.2
  audioplayers: ^6.1.0
  flutter_local_notifications: ^17.2.4
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icon/

# Configuration de flutter_launcher_icons.
# Générer les icônes :   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true                      # iOS n'accepte pas l'alpha — il faut un fond plein
  image_path: "assets/icon/momentum-icon-1024.png"
  background_color_ios: "#F7F3EA"             # fond cream sous l'icône iOS (au cas où l'alpha existe)
  # Android adaptive icon : foreground transparent + fond plein cream
  adaptive_icon_background: "#F7F3EA"
  adaptive_icon_foreground: "assets/icon/momentum-icon-foreground.png"
  # Monochrome pour Android 13+ (themed icons) — on réutilise le foreground
  adaptive_icon_monochrome: "assets/icon/momentum-icon-foreground.png"
  min_sdk_android: 21
